name: Build Windows App

# Teera for Windows: the desktop module (teera/desktop), which compiles the Android app's
# own screens and view model with Compose for Desktop. Builds the installers on a real
# Windows machine and publishes them as a release, so the download link never changes
# shape: https://github.com/<owner>/<repo>/releases/download/windows-v<version>/Teera-<version>.msi

on:
  push:
    paths:
      - 'teera/desktop/**'
      - 'teera/app/src/main/kotlin/**'
      - 'teera/core/**'
      - 'teera/*.kts'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Teera for Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: teera
    env:
      # The Android app is not part of this build.
      ANDROID_HOME: ''
      ANDROID_SDK_ROOT: ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test the rules and the Windows screens
        run: ./gradlew.bat :core:test :desktop:test --no-daemon --console=plain

      - name: Build the installers
        run: ./gradlew.bat :desktop:packageMsi :desktop:packageExe --no-daemon --console=plain

      - name: Find the version
        id: version
        shell: bash
        run: |
          msi=$(ls desktop/build/compose/binaries/main/msi/*.msi | head -1)
          version=$(basename "$msi" .msi | sed 's/^Teera-//')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Built $msi (version $version)"

      - uses: actions/upload-artifact@v4
        with:
          name: Teera-Windows
          path: |
            teera/desktop/build/compose/binaries/main/msi/*.msi
            teera/desktop/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error

      - name: Publish the release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: طيرة للويندوز ${{ steps.version.outputs.version }}
          body: |
            طيرة على الكمبيوتر (Windows 10/11).
            نزّل Teera-${{ steps.version.outputs.version }}.msi وشغّله. إذا طلع "Windows protected your PC" دوس More info ← Run anyway.
          files: |
            teera/desktop/build/compose/binaries/main/msi/*.msi
            teera/desktop/build/compose/binaries/main/exe/*.exe
          make_latest: false

      # The same installer under a fixed name and tag, so the game page's link
      # (/windows → .../releases/download/windows-latest/Teera.msi) never changes.
      - name: Name the installer for the game page
        if: github.ref == 'refs/heads/claude/android-domino-multiplayer-0drvhg'
        shell: bash
        run: cp desktop/build/compose/binaries/main/msi/*.msi desktop/build/Teera.msi

      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/claude/android-domino-multiplayer-0drvhg'
        with:
          tag_name: windows-latest
          name: طيرة للويندوز (آخر نسخة)
          body: |
            آخر نسخة من طيرة للكمبيوتر (Windows 10/11). نزّل Teera.msi وشغّله.
            إذا طلع "Windows protected your PC" دوس More info ← Run anyway.
          files: teera/desktop/build/Teera.msi
          make_latest: false

name: Build iOS App

permissions:
  contents: write

on:
  push:
    paths:
      - 'ios/**'
      - 'teera/iphone/**'
      - 'teera/app/src/main/kotlin/**'
      - 'teera/core/**'
      - 'teera/*.kts'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Teera iOS App
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      # The Android app is not part of this build.
      ANDROID_HOME: ''
      ANDROID_SDK_ROOT: ''

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Print Xcode Version
        run: xcodebuild -version

      # The game is Kotlin shared with Android and Windows (teera/iphone); Xcode's
      # "Build TeeraKit" phase runs Gradle to compile it for iOS.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-2.0.21

      # Kotlin first, on its own, so a compile error reads plainly here.
      - name: Compile the game for iOS
        working-directory: teera
        run: ./gradlew :iphone:compileKotlinIosArm64 --no-daemon --console=plain

      - name: Build iOS Application (Release)
        run: |
          xcodebuild clean build \
            -project ios/Teera.xcodeproj \
            -scheme Teera \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload into Unsigned IPA
        run: |
          APP_PATH=$(find build/DerivedData -name "Teera.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r ../Teera-unsigned.ipa Payload
          cd ../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Teera-iOS-IPA
          path: build/Teera-unsigned.ipa
          retention-days: 14

      # A fixed tag, so the address the game page points at never changes:
      # .../releases/download/ios-latest/Teera.ipa. Sideloadly signs it with the player's Apple ID.
      - name: Publish for the game page (/ios.ipa)
        if: github.ref == 'refs/heads/claude/android-domino-multiplayer-0drvhg'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/Teera-unsigned.ipa build/Teera.ipa
          gh release delete ios-latest --cleanup-tag --yes 2>/dev/null || true
          gh release create ios-latest build/Teera.ipa --target "$GITHUB_SHA" --title "طيرة للآيفون" \
            --notes "طيرة على الآيفون، بدون App Store. طريقة التنصيب: https://teera-xfvr.onrender.com/ios" --latest=false

name: Build iOS App

permissions:
  contents: write

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Teera iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Print Xcode Version
        run: xcodebuild -version

      - name: Build iOS Application (Release)
        run: |
          xcodebuild clean build \
            -project ios/Teera.xcodeproj \
            -scheme Teera \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload into Unsigned IPA
        run: |
          APP_PATH=$(find build/DerivedData -name "Teera.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r ../Teera-unsigned.ipa Payload
          cd ../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Teera-iOS-IPA
          path: build/Teera-unsigned.ipa
          retention-days: 14

      - name: Publish for the game page (/ios.ipa)
        if: github.ref == 'refs/heads/claude/android-domino-multiplayer-0drvhg'
        run: cp build/Teera-unsigned.ipa build/Teera.ipa

      # A fixed tag, so the address the game page points at never changes:
      # .../releases/download/ios-latest/Teera.ipa. Sideloadly signs it with the player's Apple ID.
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/claude/android-domino-multiplayer-0drvhg'
        with:
          tag_name: ios-latest
          name: طيرة للآيفون
          body: |
            طيرة على الآيفون، بدون App Store. طريقة التنصيب: https://teera-xfvr.onrender.com/ios
          files: build/Teera.ipa
          make_latest: false

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1e1309">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>طيرة · العب من المتصفح</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #1e1309; overflow: hidden; overscroll-behavior: none; }
  #ComposeTarget { position: fixed; inset: 0; width: 100%; height: 100%; outline: none; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; color: #d9b166; font: 20px system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; text-align: center; padding: 24px; }
  #loading img { width: 96px; height: 96px; border-radius: 50%; box-shadow: 0 8px 24px rgba(0,0,0,.5); animation: pulse 1.4s ease-in-out infinite; }
  #loading small { color: #b9a585; font-size: 14px; max-width: 420px; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
</style>
</head>
<body>
<div id="loading">
  <img src="icon.png" alt="">
  <div>طيرة تتحمّل…</div>
  <small id="hint">أول مرة تاخذ شوية. إذا ما فتحت، حدّث المتصفح (Chrome أو Safari أو Firefox الجديد).</small>
</div>
<canvas id="ComposeTarget"></canvas>
<script>
  // WebAssembly with garbage collection: Chrome/Edge 119+, Firefox 120+, Safari 18.2+.
  const supported = (() => { try { return WebAssembly.validate(new Uint8Array([0,97,115,109,1,0,0,0,1,4,1,95,0,0])); } catch (e) { return false; } })();
  if (!supported) document.getElementById("hint").textContent = "متصفحك قديم وما يشغّل اللعبة. حدّثه، أو نزّل اللعبة على تليفونك من الصفحة الرئيسية.";
</script>
<script src="teera.js"></script>
</body>
</html>
